server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Este container é publicado pelo nginx dos microservices em /app/study/.
    location = /app/study {
        return 302 /app/study/;
    }

    location = /app {
        return 302 /app/study/;
    }

    location = / {
        return 302 /app/study/;
    }

    # SPA sem router: qualquer rota desconhecida cai no index do app.
    location /app/study/ {
        try_files $uri $uri/index.html /app/study/index.html;
    }

    location ~* ^/app/study/assets/.+\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
